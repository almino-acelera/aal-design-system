<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>Aline Loiola — Arquitetura ARCO™</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-page)}</style></head><body>
<div id="root"></div>
<template id="__bundler_thumbnail"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#4e4c29"/><text x="50" y="62" font-family="Georgia,serif" font-size="34" fill="#dcc79a" text-anchor="middle">Al</text></svg></template>
<script type="text/babel" src="Chrome.jsx"></script>
<script type="text/babel" src="Home.jsx"></script>
<script type="text/babel" src="Apply.jsx"></script>
<script type="text/babel" data-presets="react">
function SiteApp(){
  const [route,setRoute] = React.useState('home');
  const go = (r) => {
    if(r === 'aplicar'){ setRoute('aplicar'); window.scrollTo(0,0); return; }
    setRoute('home');
    requestAnimationFrame(()=>{
      const el = document.getElementById(r);
      if(el) window.scrollTo({top: el.offsetTop - 70, behavior:'smooth'});
      else window.scrollTo({top:0, behavior:'smooth'});
    });
  };
  React.useEffect(()=>{ if(window.lucide) lucide.createIcons(); });
  return (<>
    <SiteHeader route={route} go={go}/>
    {route === 'aplicar' ? <Apply go={go}/> : <Home go={go}/>}
    <SiteFooter go={go}/>
  </>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<SiteApp/>);
</script></body></html>
