<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:2px}.sw{height:58px;border-radius:2px;border:1px solid rgba(38,25,15,.06)}.n{font-size:9px;color:var(--text-muted);letter-spacing:.06em;margin-top:6px;text-align:center}</style></head><body>
<div class="grid">
<div><div class="sw" style="background:var(--sand-50)"></div><div class="n">sand-50</div></div>
<div><div class="sw" style="background:var(--sand-100)"></div><div class="n">sand-100</div></div>
<div><div class="sw" style="background:var(--sand-200)"></div><div class="n">sand-200</div></div>
<div><div class="sw" style="background:var(--sand-300)"></div><div class="n">sand-300</div></div>
<div><div class="sw" style="background:var(--ink-300)"></div><div class="n">ink-300</div></div>
<div><div class="sw" style="background:var(--ink-500)"></div><div class="n">ink-500</div></div>
<div><div class="sw" style="background:var(--ink-700)"></div><div class="n">ink-700</div></div>
<div><div class="sw" style="background:var(--ink-900)"></div><div class="n">ink-900</div></div>
</div>
</body></html>
