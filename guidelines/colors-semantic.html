<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.chip{border:1px solid var(--border-soft);border-radius:4px;overflow:hidden}.bar{height:34px}.tint{padding:8px 10px;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}</style></head><body>
<div class="grid">
<div class="chip"><div class="bar" style="background:var(--success-600)"></div><div class="tint" style="background:var(--success-100);color:var(--success-600)">Sucesso</div></div>
<div class="chip"><div class="bar" style="background:var(--warning-600)"></div><div class="tint" style="background:var(--warning-100);color:var(--warning-600)">Atenção</div></div>
<div class="chip"><div class="bar" style="background:var(--danger-600)"></div><div class="tint" style="background:var(--danger-100);color:var(--danger-600)">Erro</div></div>
<div class="chip"><div class="bar" style="background:var(--info-600)"></div><div class="tint" style="background:var(--info-100);color:var(--info-600)">Informação</div></div>
</div>
<div style="margin-top:12px;font-size:11px;color:var(--text-muted);letter-spacing:.04em">Atenção reusa o dourado da marca — não introduza amarelo puro</div>
</body></html>
