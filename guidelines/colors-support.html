<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.grp{display:flex;gap:2px}.sw{flex:1;height:56px;border-radius:2px}.cap{font-size:9px;color:var(--text-muted);letter-spacing:.14em;text-transform:uppercase;margin:0 0 6px;font-weight:600}</style></head><body>
