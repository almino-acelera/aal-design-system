<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.s{height:118px;border-radius:4px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:10px}.n{font-size:9px;letter-spacing:.12em;text-transform:uppercase;font-weight:600}</style></head><body>
<div class="grid">
<div class="s" style="background:var(--sand-50);border:1px solid var(--border-soft)"><span class="n" style="color:var(--text-muted)">Página · areia</span></div>
<div class="s" style="background:var(--gradient-olive-deep)"><span class="n" style="color:var(--gold-400)">Seção · oliva profundo</span></div>
<div class="s" style="background:var(--gold-50);border:1px solid var(--border-hairline)"><span class="n" style="color:var(--gold-800)">Destaque · dourado 50</span></div>
<div class="s" style="background:var(--brown-700)"><span style="position:absolute;inset:0;background:var(--gradient-protect-bottom)"></span><span class="n" style="color:var(--sand-100);position:relative">Foto + véu inferior</span></div>
</div>
</body></html>
