<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px;background:var(--surface-page);font-family:var(--font-sans)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.pair{border-radius:4px;padding:16px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}.t{font-family:var(--font-serif);font-size:17px;letter-spacing:.04em}.c{font-size:9px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;opacity:.85}</style></head><body>
<div class="grid">
<div class="pair" style="background:var(--sand-50);border:1px solid var(--border-soft)"><span class="t" style="color:var(--olive-800)">Fechamento</span><span class="c" style="color:var(--gold-700)">Areia + oliva 800</span></div>
<div class="pair" style="background:var(--olive-900)"><span class="t" style="color:var(--sand-50)">Fechamento</span><span class="c" style="color:var(--gold-400)">Oliva 900 + areia</span></div>
<div class="pair" style="background:var(--gold-600)"><span class="t" style="color:var(--olive-900)">Fechamento</span><span class="c" style="color:var(--olive-800)">Dourado + oliva 900</span></div>
<div class="pair" style="background:var(--gold-50);border:1px solid var(--border-hairline)"><span class="t" style="color:var(--olive-700)">Fechamento</span><span class="c" style="color:var(--gold-800)">Dourado 50 + oliva 700</span></div>
</div>
</body></html>
